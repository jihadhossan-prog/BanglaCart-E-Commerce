<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AponBazar — Admin Portal | এডমিন ড্যাশবোর্ড</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./admin.css">
</head>
<body>

  <!-- Admin Verification Guard Screen -->
  <div id="admin-guard-screen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm text-center space-y-4">
      <div class="w-12 h-12 bg-emerald-100 rounded-full flex items-center justify-center mx-auto text-emerald-700">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      </div>
      <h3 class="text-base font-bold text-slate-800">এডমিন পারমিশন যাচাই</h3>
      <p class="text-xs text-slate-500" id="guard-status-text">সিস্টেম যাচাই করা হচ্ছে...</p>
    </div>
  </div>

  <!-- Admin Panel Root Layout -->
  <div class="admin-layout hidden" id="admin-app">

    <!-- Admin Sidebar -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="p-5 border-b border-slate-800 flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold">
          আ
        </div>
        <div>
          <h2 class="text-sm font-bold text-white leading-none">আপনবাজার</h2>
          <span class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">এডমিন প্যানেল</span>
        </div>
      </div>

      <nav class="p-3 space-y-1 flex-1 overflow-y-auto">
        <a href="#dashboard" class="admin-nav-item active" id="admin-nav-dashboard">
          <span>ড্যাশবোর্ড</span>
        </a>
        <a href="#products" class="admin-nav-item" id="admin-nav-products">
          <span>পণ্য ব্যবস্থাপনা</span>
        </a>
        <a href="#categories" class="admin-nav-item" id="admin-nav-categories">
          <span>ক্যাটাগরি</span>
        </a>
        <a href="#orders" class="admin-nav-item" id="admin-nav-orders">
          <span>অর্ডার সমূহ</span>
        </a>
        <a href="#coupons" class="admin-nav-item" id="admin-nav-coupons">
          <span>কুপন</span>
        </a>
        <a href="#banners" class="admin-nav-item" id="admin-nav-banners">
          <span>ব্যানার</span>
        </a>
        <a href="#pages" class="admin-nav-item" id="admin-nav-pages"><span>পেজ ও ইনফো (Help/Contact/About)</span></a>
        <a href="#chat" class="admin-nav-item" id="admin-nav-chat">
          <span>লাইভ চ্যাট ড্যাশবোর্ড</span>
        </a>
      </nav>

      <div class="p-4 border-t border-slate-800">
        <button id="btn-admin-logout" class="w-full bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white font-bold py-2 rounded-lg text-xs min-h-[44px] transition-all">
          লগ আউট
        </button>
      </div>
    </aside>

    <!-- Admin Content View -->
    <main class="admin-main">
      <header class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-xl font-bold text-slate-900" id="admin-view-title">ড্যাশবোর্ড ওভারভিউ</h1>
          <p class="text-xs text-slate-500">আপনবাজার ই-কমার্স ম্যানেজমেন্ট</p>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-bold">এডমিন মোড</span>
        </div>
      </header>

      <div id="admin-main-content">
        <!-- Content dynamically injected by admin.js -->
      </div>
    </main>

  </div>

  <script type="module" src="./admin.js"></script>
</body>
</html>
