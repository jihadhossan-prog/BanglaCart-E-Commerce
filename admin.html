<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>বাংলামার্ট এডমিন প্যানেল | Admin Dashboard</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./admin.css" />
</head>
<body class="bg-slate-50 text-slate-900 antialiased">

  <!-- Admin Auth Access Check Splash Overlay -->
  <div id="admin-auth-check" class="fixed inset-0 z-50 bg-slate-900 flex flex-col items-center justify-center text-white p-4">
    <div class="w-12 h-12 border-4 border-teal-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <h3 class="text-base font-bold">এডমিন এক্সেস যাচাই করা হচ্ছে...</h3>
    <p class="text-xs text-slate-400 mt-1">অনুগ্রহ করে অপেক্ষা করুন</p>
  </div>

  <div class="min-h-screen flex flex-col md:flex-row">
    <!-- Admin Sidebar Navigation -->
    <aside class="w-full md:w-64 bg-white text-slate-800 flex flex-col border-b md:border-b-0 md:border-r border-slate-200 shadow-xs">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50/60">
        <div class="flex items-center gap-2">
          <svg class="w-6 h-6 text-teal-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
          <span class="font-bold text-slate-900 text-base">বাংলামার্ট এডমিন</span>
        </div>
        <a href="./index.html" class="text-xs font-semibold text-teal-700 hover:text-teal-800 bg-teal-50 px-2.5 py-1 rounded-lg border border-teal-100 transition">সাইটে যান &rarr;</a>
      </div>

      <nav class="p-3 space-y-1 flex-1 overflow-y-auto">
        <button data-tab="dashboard" class="admin-sidebar-item active cursor-pointer">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          <span>ড্যাশবোর্ড</span>
        </button>
        <button data-tab="products" class="admin-sidebar-item cursor-pointer">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          <span>প্রোডাক্ট ম্যানেজমেন্ট</span>
        </button>
        <button data-tab="categories" class="admin-sidebar-item cursor-pointer">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
          <span>ক্যাটাগরি ম্যানেজমেন্ট</span>
        </button>
        <button data-tab="banners" class="admin-sidebar-item cursor-pointer">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <span>ব্যনার ম্যানেজমেন্ট</span>
        </button>
        <button data-tab="orders" class="admin-sidebar-item cursor-pointer">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          <span>অর্ডার ম্যানেজমেন্ট</span>
        </button>
        <button data-tab="customers" class="admin-sidebar-item cursor-pointer">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <span>কাস্টমার লিস্ট</span>
        </button>
        <button data-tab="coupons" class="admin-sidebar-item cursor-pointer">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
          <span>কুপন ম্যানেজমেন্ট</span>
        </button>
        <button data-tab="inventory" class="admin-sidebar-item cursor-pointer">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <span>স্টক ও ইনভেন্টরি</span>
        </button>
        <button data-tab="chat" class="admin-sidebar-item cursor-pointer">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
          <span>লাইভ চ্যাট ড্যাশবোর্ড</span>
        </button>
        <button data-tab="notifications" class="admin-sidebar-item cursor-pointer">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span>নোটিফিকেশন পাঠান</span>
        </button>
        <button data-tab="content" class="admin-sidebar-item cursor-pointer">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
          <span>পেজ কন্টেন্ট</span>
        </button>
      </nav>
    </aside>

    <!-- Admin Main View Area -->
    <main id="admin-main-content" class="flex-1 p-4 sm:p-6 overflow-y-auto">
      <!-- Dynamic Admin Modules Injected Here -->
    </main>
  </div>

  <script type="module" src="./admin.js"></script>
</body>
</html>
