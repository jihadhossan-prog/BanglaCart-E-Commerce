<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="বাংলামার্ট - প্রিমিয়াম অনলাইন কেনাকাটা। দ্রুত ডেলিভারি ও বিকাশ/নগদ পেমেন্ট।" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>বাংলামার্ট | BanglaMart E-Commerce</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./pages.css" />
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-teal-500 selection:text-white">

  <!-- Top Header App Bar -->
  <header class="sticky top-0 z-30 bg-white border-b border-slate-200 shadow-xs safe-top">
    <div class="px-4 py-3 max-w-7xl mx-auto flex items-center justify-between gap-3">
      <!-- Logo -->
      <a href="#" id="header-logo" class="flex items-center gap-2 text-teal-700 font-bold text-lg tracking-tight hover:opacity-90 transition">
        <svg class="w-7 h-7 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <span>বাংলামার্ট</span>
      </a>

      <!-- Compact Search Bar -->
      <div class="flex-1 max-w-md relative">
        <input type="text" id="search-input" placeholder="পণ্য খুঁজুন..." class="w-full bg-slate-100 text-sm text-slate-800 rounded-full pl-9 pr-8 py-2 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition" />
        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <button id="clear-search" class="hidden absolute right-2.5 top-2.5 text-slate-400 hover:text-slate-600">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Hamburger Menu Button -->
      <button id="menu-btn" aria-label="মেনু খুলুন" class="p-2 rounded-lg text-slate-700 hover:bg-slate-100 transition relative">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span id="unread-dot" class="hidden absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-red-500 rounded-full ring-2 ring-white"></span>
      </button>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app-content" class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-4 py-4">
    <!-- Dynamic views injected here: Home, Category, Details, Wishlist, Cart, Checkout, Chat, Profile -->
  </main>

  <!-- Side Drawer Hamburger Menu -->
  <div id="drawer-overlay" class="drawer-overlay">
    <div class="drawer-content p-5">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <div class="flex items-center gap-3">
          <div id="user-avatar" class="w-10 h-10 rounded-full bg-teal-100 text-teal-700 font-bold flex items-center justify-center text-base">
            G
          </div>
          <div>
            <h4 id="user-name-display" class="font-semibold text-slate-900 text-sm">অতিথি গ্রাহক</h4>
            <p id="user-email-display" class="text-xs text-slate-500">লগইন করুন</p>
          </div>
        </div>
        <button id="close-drawer-btn" class="p-1 rounded-full text-slate-400 hover:text-slate-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Drawer Nav List (Strict Order) -->
      <nav class="py-4 space-y-1 text-sm font-medium text-slate-700">
        <button data-nav="profile" class="drawer-item">
          <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span>আমার প্রোফাইল</span>
        </button>
        <button data-nav="orders" class="drawer-item">
          <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          <span>আমার অর্ডারসমূহ</span>
        </button>
        <button data-nav="wishlist" class="drawer-item">
          <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
          <span>উইশলিস্ট</span>
        </button>
        <button data-nav="chat" class="drawer-item">
          <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
          <span>লাইভ চ্যাট</span>
        </button>
        <button data-nav="notifications" class="drawer-item">
          <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span>নোটিফিকেশন</span>
        </button>
        <button data-nav="settings" class="drawer-item">
          <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span>সেটিংস</span>
        </button>
        <button data-nav="help" class="drawer-item">
          <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <span>হেল্প সেন্টার</span>
        </button>
        <button data-nav="contact" class="drawer-item">
          <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span>যোগাযোগ</span>
        </button>
        <button data-nav="about" class="drawer-item">
          <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>আমাদের সম্পর্কে</span>
        </button>
        <hr class="my-2 border-slate-100" />
        <button id="drawer-auth-btn" class="drawer-item text-red-600 hover:bg-red-50">
          <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          <span id="drawer-auth-text">লগআউট</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Bottom Navigation (Fixed, 5 Items) -->
  <nav class="bottom-nav">
    <button data-tab="home" class="bottom-nav-item active">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>হোম</span>
    </button>
    <button data-tab="wishlist" class="bottom-nav-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
      <span>উইশলিস্ট</span>
      <span id="wishlist-badge" class="nav-badge hidden">0</span>
    </button>
    <button data-tab="cart" class="bottom-nav-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
      <span>কার্ট</span>
      <span id="cart-badge" class="nav-badge hidden">0</span>
    </button>
    <button data-tab="chat" class="bottom-nav-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
      <span>চ্যাট</span>
      <span id="chat-badge" class="nav-badge hidden">0</span>
    </button>
    <button data-tab="profile" class="bottom-nav-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span>প্রোফাইল</span>
    </button>
  </nav>

  <!-- Auth Modal -->
  <div id="auth-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl relative animate-in fade-in zoom-in duration-200">
      <button id="close-auth-modal" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>

      <!-- Auth Tabs -->
      <div class="flex border-b border-slate-200 mb-5">
        <button id="tab-login" class="flex-1 py-2 font-semibold text-teal-600 border-b-2 border-teal-600 text-center">লগইন</button>
        <button id="tab-register" class="flex-1 py-2 font-semibold text-slate-500 border-b-2 border-transparent text-center">রেজিস্ট্রেশন</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">ইমেইল এড্রেস</label>
          <input type="email" id="login-email" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none" placeholder="your@email.com" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">পাসওয়ার্ড</label>
          <input type="password" id="login-password" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none" placeholder="******" />
        </div>
        <div class="flex justify-end">
          <button type="button" id="forgot-password-btn" class="text-xs text-teal-600 hover:underline">পাসওয়ার্ড ভুলে গেছেন?</button>
        </div>
        <button type="submit" class="w-full py-2.5 bg-teal-700 hover:bg-teal-800 text-white font-semibold rounded-lg text-sm transition">লগইন করুন</button>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="space-y-3 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">পূর্ণ নাম</label>
          <input type="text" id="reg-name" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none" placeholder="আপনার নাম" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">মোবাইল নম্বর</label>
          <input type="tel" id="reg-phone" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none" placeholder="01700000000" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">ইমেইল এড্রেস</label>
          <input type="email" id="reg-email" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none" placeholder="your@email.com" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">পাসওয়ার্ড (নূন্যতম ৬ অক্ষর)</label>
          <input type="password" id="reg-password" required minlength="6" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none" placeholder="******" />
        </div>
        <button type="submit" class="w-full py-2.5 bg-teal-700 hover:bg-teal-800 text-white font-semibold rounded-lg text-sm transition">রেজিস্টার করুন</button>
      </form>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
